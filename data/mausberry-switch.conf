# [Pins] section: GPIO pin configuration.
[Pins]

#
# Out: integer
# Default value: 23
#
# The pin number to which the "out" lead is connected.
#
Out=23

#
# In: integer
# Default value: 24
#
# The pin number to which the "in" lead is connected.
#
In=24

# [Config] Section: General configuration settings.
[Config]

#
# ShutdownCommand: string
# Default value: systemctl poweroff
#
# This command is run when the power switch is toggled off. If it fails,
# the service is restarted and tries again after 5 seconds.
#
# The service runs with a read-only file system (ProtectSystem=strict), so
# commands that need to write files must be allowed in the unit file.
#
ShutdownCommand=systemctl poweroff

#
# Delay: integer
# Default value: 0
#
# Integer number of seconds to wait between when the switch is pressed and
# when the ShutdownCommand above is run. Turning the switch back on during
# the delay cancels the shutdown.
#
Delay=0
